name: CI

on: [ push ]

jobs:
  upload:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ "el8", "el9" ]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install astyle
        run: |
          sudo apt-get update
          sudo apt-get install -y astyle

      - name: Check astyle version
        run: astyle --version

      - name: Run astyle
        run: astyle --dry-run --options=astyle-options.ini --mode=c --recursive "./*.c, *.h"

      - name: Check Podman version
        run: podman --version

      - name: enable podman
        run: systemctl --user start podman.socket

      - name: Build container
        run: podman build . --tag builder -f "Dockerfile.${{ matrix.os }}"

      - name: Build project
        run: podman run -v "${{ github.workspace }}:/code:Z" builder
